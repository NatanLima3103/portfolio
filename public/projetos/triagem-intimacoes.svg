<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Fluxo de importação da Triagem de Intimações</title>
  <desc id="desc">Numa aplicação FastAPI única com SQLite, a planilha de intimações passa por normalização dos campos e verificação de duplicatas, é gravada no SQLite e exibida como fila de trabalho ordenada por prazo. As palavras-chave, configuráveis, destacam o texto na fila. O acesso exige login com senha armazenada como hash bcrypt.</desc>

  <!-- Fundo opaco próprio: o SVG entra via <img> e não enxerga o tema do site,
       então fica legível tanto sobre o fundo claro quanto sobre o escuro. -->
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; fill: #e6edf3; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rotulo { font-size: 12px; fill: #93a4b3; letter-spacing: 0.08em; }
    .nome { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: #93a4b3; }
    .caixa { fill: #16212b; stroke: #2b3b49; stroke-width: 1.5; }
    .caixa-destaque { fill: #2dd4bf1f; stroke: #2dd4bf; stroke-width: 1.5; }
    .limite { fill: none; stroke: #2b3b49; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .fluxo { fill: none; stroke: #93a4b3; stroke-width: 1.6; }
    .tracejado { stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93a4b3" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#0b0f14" />

  <!-- Limite da aplicação -->
  <rect class="limite" x="176" y="20" width="804" height="340" rx="14" />
  <text class="mono rotulo" x="196" y="48">APLICAÇÃO ÚNICA · FASTAPI + SQLITE</text>

  <!-- Acesso -->
  <rect class="caixa" x="20" y="72" width="136" height="56" rx="10" />
  <text class="nome" x="88" y="96" text-anchor="middle">Usuário</text>
  <text class="sub" x="88" y="115" text-anchor="middle">navegador</text>
  <line class="fluxo" x1="156" y1="100" x2="194" y2="100" marker-end="url(#seta)" />

  <rect class="caixa" x="196" y="72" width="180" height="56" rx="10" />
  <text class="nome" x="286" y="96" text-anchor="middle">Login</text>
  <text class="sub" x="286" y="115" text-anchor="middle">senha com hash bcrypt</text>
  <polyline class="fluxo" points="376,100 860,100 860,170" marker-end="url(#seta)" />
  <text class="sub" x="618" y="92" text-anchor="middle" style="font-size:12px">acesso autenticado</text>

  <!-- Importação -->
  <rect class="caixa" x="20" y="172" width="136" height="68" rx="10" />
  <text class="nome" x="88" y="200" text-anchor="middle">Planilha</text>
  <text class="sub" x="88" y="220" text-anchor="middle">de intimações</text>
  <line class="fluxo" x1="156" y1="206" x2="194" y2="206" marker-end="url(#seta)" />

  <rect class="caixa" x="196" y="172" width="150" height="68" rx="10" />
  <text class="nome" x="271" y="200" text-anchor="middle">Normalização</text>
  <text class="sub" x="271" y="220" text-anchor="middle">colunas, datas, campos</text>
  <line class="fluxo" x1="346" y1="206" x2="382" y2="206" marker-end="url(#seta)" />

  <rect class="caixa" x="384" y="172" width="150" height="68" rx="10" />
  <text class="nome" x="459" y="200" text-anchor="middle">Duplicatas</text>
  <text class="sub" x="459" y="220" text-anchor="middle">compara campos-chave</text>
  <line class="fluxo" x1="534" y1="206" x2="570" y2="206" marker-end="url(#seta)" />

  <path class="caixa" d="M572 182 v48 a75 10 0 0 0 150 0 v-48" />
  <ellipse class="caixa" cx="647" cy="182" rx="75" ry="10" />
  <text class="nome" x="647" y="212" text-anchor="middle">SQLite</text>
  <text class="sub" x="647" y="230" text-anchor="middle">um arquivo</text>
  <line class="fluxo" x1="722" y1="206" x2="758" y2="206" marker-end="url(#seta)" />

  <rect class="caixa-destaque" x="760" y="172" width="200" height="68" rx="10" />
  <text class="nome" x="860" y="200" text-anchor="middle">Fila de trabalho</text>
  <text class="sub" x="860" y="220" text-anchor="middle">ordenada por prazo</text>

  <!-- Saídas laterais -->
  <line class="fluxo tracejado" x1="459" y1="240" x2="459" y2="288" marker-end="url(#seta)" />
  <rect class="caixa" x="374" y="290" width="170" height="48" rx="10" style="fill:none;stroke-dasharray:4 3" />
  <text class="sub" x="459" y="319" text-anchor="middle">repetidas: sinalizadas</text>

  <rect class="caixa" x="760" y="290" width="200" height="50" rx="10" />
  <text class="nome" x="860" y="311" text-anchor="middle" style="font-size:14px">Palavras-chave</text>
  <text class="sub" x="860" y="329" text-anchor="middle" style="font-size:12px">configuração, não código</text>
  <line class="fluxo" x1="860" y1="290" x2="860" y2="242" marker-end="url(#seta)" />
  <text class="sub" x="850" y="270" text-anchor="end" style="font-size:12px">destaque no texto</text>
</svg>
