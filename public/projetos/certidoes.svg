<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitetura da Plataforma de Emissão de Certidões</title>
  <desc id="desc">O cliente chama o Nginx por HTTPS; o Nginx encaminha ao gateway FastAPI, que publica cada pedido no RabbitMQ, numa fila por portal com sua dead-letter queue. Cada fila é consumida por um worker dedicado, que usa nodriver para operar os mais de 20 portais governamentais. Todos os workers usam uma biblioteca compartilhada e uma interface plugável de resolução de captcha. Tudo roda em containers Docker Compose numa VPS Linux.</desc>

  <!-- Fundo opaco próprio: o SVG entra via <img> e não enxerga o tema do site,
       então fica legível tanto sobre o fundo claro quanto sobre o escuro. -->
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; fill: #e6edf3; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rotulo { font-size: 12px; fill: #93a4b3; letter-spacing: 0.08em; }
    .nome { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: #93a4b3; }
    .destaque { fill: #2dd4bf; }
    .caixa { fill: #16212b; stroke: #2b3b49; stroke-width: 1.5; }
    .caixa-destaque { fill: #2dd4bf1f; stroke: #2dd4bf; stroke-width: 1.5; }
    .grupo { fill: #111a22; stroke: #1e2b36; stroke-width: 1.5; }
    .limite { fill: none; stroke: #2b3b49; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .fluxo { fill: none; stroke: #93a4b3; stroke-width: 1.6; }
    .tracejado { stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93a4b3" />
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#0b0f14" />

  <!-- Cliente (fora da VPS) -->
  <rect class="caixa" x="20" y="112" width="120" height="56" rx="10" />
  <text class="nome" x="80" y="137" text-anchor="middle">Cliente</text>
  <text class="sub" x="80" y="156" text-anchor="middle">chamada HTTPS</text>
  <line class="fluxo" x1="140" y1="140" x2="182" y2="140" marker-end="url(#seta)" />

  <!-- Limite da VPS -->
  <rect class="limite" x="164" y="20" width="672" height="460" rx="14" />
  <text class="mono rotulo" x="184" y="48">VPS LINUX · DOCKER COMPOSE</text>

  <!-- Entrada -->
  <text class="mono rotulo" x="184" y="92">ENTRADA</text>
  <rect class="caixa" x="184" y="112" width="170" height="56" rx="10" />
  <text class="nome" x="269" y="136" text-anchor="middle">Nginx</text>
  <text class="sub" x="269" y="156" text-anchor="middle">proxy reverso · Certbot</text>
  <line class="fluxo" x1="269" y1="168" x2="269" y2="198" marker-end="url(#seta)" />

  <rect class="caixa-destaque" x="184" y="200" width="170" height="76" rx="10" />
  <text class="nome" x="269" y="227" text-anchor="middle">Gateway · FastAPI</text>
  <text class="sub" x="269" y="248" text-anchor="middle">valida, autentica</text>
  <text class="sub" x="269" y="264" text-anchor="middle">e publica na fila</text>
  <line class="fluxo" x1="354" y1="238" x2="392" y2="238" marker-end="url(#seta)" />

  <!-- RabbitMQ: uma fila + DLQ por portal -->
  <text class="mono rotulo" x="394" y="92">RABBITMQ</text>
  <rect class="grupo" x="394" y="104" width="190" height="224" rx="12" />

  <rect class="caixa" x="406" y="120" width="44" height="40" rx="8" style="fill:none;stroke-dasharray:4 3" />
  <text class="mono sub" x="428" y="144" text-anchor="middle" style="font-size:12px">DLQ</text>
  <rect class="caixa" x="460" y="120" width="112" height="40" rx="8" />
  <text class="mono" x="516" y="145" text-anchor="middle" style="font-size:14px">fila · A</text>

  <rect class="caixa" x="406" y="196" width="44" height="40" rx="8" style="fill:none;stroke-dasharray:4 3" />
  <text class="mono sub" x="428" y="220" text-anchor="middle" style="font-size:12px">DLQ</text>
  <rect class="caixa" x="460" y="196" width="112" height="40" rx="8" />
  <text class="mono" x="516" y="221" text-anchor="middle" style="font-size:14px">fila · B</text>

  <rect class="caixa" x="406" y="272" width="44" height="40" rx="8" style="fill:none;stroke-dasharray:4 3" />
  <text class="mono sub" x="428" y="296" text-anchor="middle" style="font-size:12px">DLQ</text>
  <rect class="caixa" x="460" y="272" width="112" height="40" rx="8" />
  <text class="mono" x="516" y="297" text-anchor="middle" style="font-size:14px">fila · N</text>

  <line class="fluxo" x1="572" y1="140" x2="622" y2="140" marker-end="url(#seta)" />
  <line class="fluxo" x1="572" y1="216" x2="622" y2="216" marker-end="url(#seta)" />
  <line class="fluxo" x1="572" y1="292" x2="622" y2="292" marker-end="url(#seta)" />

  <!-- Workers: um por portal -->
  <text class="mono rotulo" x="624" y="92">WORKERS</text>
  <rect class="caixa" x="624" y="112" width="192" height="56" rx="10" />
  <text class="nome" x="720" y="136" text-anchor="middle">worker A</text>
  <text class="sub" x="720" y="156" text-anchor="middle">nodriver · navegador real</text>

  <rect class="caixa" x="624" y="188" width="192" height="56" rx="10" />
  <text class="nome" x="720" y="212" text-anchor="middle">worker B</text>
  <text class="sub" x="720" y="232" text-anchor="middle">nodriver · navegador real</text>

  <rect class="caixa" x="624" y="264" width="192" height="56" rx="10" />
  <text class="nome" x="720" y="288" text-anchor="middle">worker N</text>
  <text class="sub" x="720" y="308" text-anchor="middle">nodriver · navegador real</text>

  <line class="fluxo" x1="816" y1="140" x2="858" y2="140" marker-end="url(#seta)" />
  <line class="fluxo" x1="816" y1="216" x2="858" y2="216" marker-end="url(#seta)" />
  <line class="fluxo" x1="816" y1="292" x2="858" y2="292" marker-end="url(#seta)" />

  <!-- Portais (fora da VPS) -->
  <rect class="caixa" x="860" y="112" width="120" height="208" rx="10" />
  <text class="nome" x="920" y="198" text-anchor="middle">Portais</text>
  <text class="sub" x="920" y="218" text-anchor="middle">governamentais</text>
  <text class="mono destaque" x="920" y="256" text-anchor="middle" style="font-size:26px" font-weight="600">20+</text>

  <!-- Base comum usada por todos os workers -->
  <polyline class="fluxo tracejado" points="720,320 720,352 384,352" />
  <line class="fluxo tracejado" x1="384" y1="352" x2="384" y2="378" marker-end="url(#seta)" />
  <line class="fluxo tracejado" x1="720" y1="352" x2="720" y2="378" marker-end="url(#seta)" />
  <text class="sub" x="547" y="345" text-anchor="middle" style="font-size:12px">usados por todos os workers</text>

  <rect class="caixa" x="184" y="380" width="400" height="80" rx="10" />
  <text class="nome" x="200" y="406" style="font-size:15px">Biblioteca compartilhada</text>
  <text class="sub" x="200" y="428">contratos de mensagem · modelos · cliente do broker</text>
  <text class="sub" x="200" y="446">logging estruturado · política de retry · helpers</text>

  <rect class="caixa" x="604" y="380" width="212" height="80" rx="10" />
  <text class="nome" x="620" y="406" style="font-size:15px">Resolução de captcha</text>
  <text class="sub" x="620" y="428">interface única com</text>
  <text class="sub" x="620" y="446">provedores plugáveis</text>

  <text class="sub" x="20" y="506">DLQ (dead-letter queue): recebe a mensagem que falhou além do limite de tentativas, sem travar a fila principal.</text>
</svg>
