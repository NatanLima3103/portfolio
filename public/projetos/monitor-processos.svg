<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Fluxo do Monitor de Processos Municipais</title>
  <desc id="desc">Dentro de um container Docker, o agendador dispara as rodadas; o coletor em Playwright opera os portais de prefeituras com um navegador real, detectando a variante do reCAPTCHA, buscando elementos no frame certo e esperando por condições; a etapa de comparação confronta o resultado com o estado anterior e gera um relatório só com o que mudou.</desc>

  <!-- Fundo opaco próprio: o SVG entra via <img> e não enxerga o tema do site,
       então fica legível tanto sobre o fundo claro quanto sobre o escuro. -->
  <style>
    text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; fill: #e6edf3; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rotulo { font-size: 12px; fill: #93a4b3; letter-spacing: 0.08em; }
    .passo { font-size: 12px; fill: #2dd4bf; }
    .nome { font-size: 16px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: #93a4b3; }
    .item { font-size: 13px; }
    .caixa { fill: #16212b; stroke: #2b3b49; stroke-width: 1.5; }
    .caixa-destaque { fill: #2dd4bf1f; stroke: #2dd4bf; stroke-width: 1.5; }
    .grupo { fill: #0b0f14; stroke: #2b3b49; stroke-width: 1.2; }
    .limite { fill: none; stroke: #2b3b49; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .fluxo { fill: none; stroke: #93a4b3; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93a4b3" />
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#0b0f14" />

  <!-- Limite do container -->
  <rect class="limite" x="20" y="20" width="760" height="330" rx="14" />
  <text class="mono rotulo" x="40" y="48">CONTAINER DOCKER · NAVEGADOR E DEPENDÊNCIAS FIXADOS NA IMAGEM</text>

  <!-- 01 Agendador -->
  <rect class="caixa" x="44" y="150" width="170" height="76" rx="10" />
  <text class="mono passo" x="58" y="170">01</text>
  <text class="nome" x="129" y="192" text-anchor="middle">Agendador</text>
  <text class="sub" x="129" y="212" text-anchor="middle">dispara as rodadas</text>
  <line class="fluxo" x1="214" y1="188" x2="252" y2="188" marker-end="url(#seta)" />

  <!-- 02 Coletor -->
  <rect class="caixa-destaque" x="254" y="76" width="300" height="224" rx="12" />
  <text class="mono passo" x="268" y="104">02</text>
  <text class="nome" x="404" y="106" text-anchor="middle">Coletor · Playwright</text>

  <rect class="grupo" x="270" y="124" width="268" height="44" rx="8" />
  <text class="item" x="404" y="151" text-anchor="middle">detecta a variante do reCAPTCHA</text>
  <rect class="grupo" x="270" y="180" width="268" height="44" rx="8" />
  <text class="item" x="404" y="207" text-anchor="middle">busca no frame certo (iframe/modal)</text>
  <rect class="grupo" x="270" y="236" width="268" height="44" rx="8" />
  <text class="item" x="404" y="263" text-anchor="middle">espera por condição, nunca por tempo</text>

  <line class="fluxo" x1="554" y1="188" x2="592" y2="188" marker-end="url(#seta)" />

  <!-- 03 Comparação -->
  <rect class="caixa" x="594" y="150" width="166" height="76" rx="10" />
  <text class="mono passo" x="608" y="170">03</text>
  <text class="nome" x="677" y="192" text-anchor="middle">Comparação</text>
  <text class="sub" x="677" y="212" text-anchor="middle">com o estado anterior</text>

  <!-- Estado anterior -->
  <line class="fluxo" x1="677" y1="230" x2="677" y2="266" marker-start="url(#seta)" marker-end="url(#seta)" />
  <path class="caixa" d="M617 278 v36 a60 10 0 0 0 120 0 v-36" />
  <ellipse class="caixa" cx="677" cy="278" rx="60" ry="10" />
  <text class="sub" x="677" y="308" text-anchor="middle">estado anterior</text>

  <!-- Saída -->
  <line class="fluxo" x1="760" y1="188" x2="818" y2="188" marker-end="url(#seta)" />
  <rect class="caixa" x="820" y="150" width="160" height="76" rx="10" />
  <text class="nome" x="900" y="186" text-anchor="middle">Relatório</text>
  <text class="sub" x="900" y="206" text-anchor="middle">só o que mudou</text>

  <!-- Portais (fora do container) -->
  <line class="fluxo" x1="404" y1="302" x2="404" y2="392" marker-start="url(#seta)" marker-end="url(#seta)" />
  <text class="sub" x="414" y="332">navegador real</text>
  <rect class="caixa" x="254" y="394" width="300" height="56" rx="10" />
  <text class="nome" x="404" y="418" text-anchor="middle" style="font-size:15px">Portais de prefeituras</text>
  <text class="sub" x="404" y="438" text-anchor="middle">JS no cliente · sessão · reCAPTCHA</text>
</svg>
